/* ============ BASE ============ */
:root{
  --brand:#0D3B66; --brand-dark:#082844; --brand-light:#1A5490;
  --accent:#F5A623; --success:#16A34A; --danger:#DC2626;
  --bg:#F7F9FB; --card:#FFF; --text:#1B1B1B; --muted:#6B7280;
  --border:#E5E7EB; --radius:14px;
  --shadow-sm:0 1px 2px rgba(13,59,102,.06);
  --shadow-md:0 4px 16px rgba(13,59,102,.08);
  --shadow-lg:0 12px 40px rgba(13,59,102,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
  display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}

/* ============ HEADER ============ */
header{background:var(--brand);color:#fff;padding:12px 20px;
  position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm)}
.nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;color:#fff}
.logo-mark{width:36px;height:36px;background:#fff;color:var(--brand);
  border-radius:10px;display:grid;place-items:center;font-weight:900}
.nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav-links a,.nav-links button{color:#fff;font-size:.88rem;font-weight:600;
  padding:8px 14px;border-radius:10px;transition:background .2s}
.nav-links a:hover,.nav-links button:hover{background:rgba(255,255,255,.12)}
.nav-cta{background:#fff !important;color:var(--brand) !important}
.nav-cta:hover{background:#f0f4f8 !important}

/* ============ LAYOUT ============ */
main{flex:1;max-width:1200px;width:100%;margin:0 auto;padding:0 20px}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ HERO ============ */
.hero{padding:64px 20px 48px;text-align:center;
  background:linear-gradient(180deg,rgba(13,59,102,.05),transparent)}
.hero h1{font-size:clamp(2rem,5vw,3rem);color:var(--brand);font-weight:900;
  letter-spacing:-.02em;line-height:1.15;margin-bottom:16px}
.hero p{font-size:clamp(1rem,2.2vw,1.15rem);color:var(--muted);
  max-width:640px;margin:0 auto 32px}
.search-bar{max-width:640px;margin:0 auto;display:flex;gap:8px;background:#fff;
  padding:8px;border-radius:16px;box-shadow:var(--shadow-md)}
.search-bar input{flex:1;border:none;outline:none;padding:12px 16px;
  font-size:1rem;background:transparent;color:var(--text)}
.search-bar button{background:var(--brand);color:#fff;padding:12px 24px;
  border-radius:12px;font-weight:700;transition:background .2s}
.search-bar button:hover{background:var(--brand-light)}

/* ============ SECCIONES ============ */
.section{padding:32px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;gap:12px;flex-wrap:wrap}
.section-title{font-size:1.4rem;font-weight:800;color:var(--brand)}
.section-link{color:var(--brand);font-weight:600;font-size:.9rem}

/* ============ CATEGORÍAS ============ */
.categorias{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.categoria{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 12px;text-align:center;
  cursor:pointer;transition:all .2s}
.categoria:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--brand)}
.categoria .emoji{font-size:2rem;display:block;margin-bottom:8px}
.categoria .nombre{font-size:.85rem;font-weight:700;color:var(--brand)}

/* ============ TARJETA TRABAJADOR ============ */
.grid-trabajadores{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.trabajador-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;
  gap:12px;transition:all .2s}
.trabajador-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.tc-head{display:flex;gap:12px;align-items:flex-start}
.tc-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;
  background:var(--border);flex-shrink:0}
.tc-info{flex:1;min-width:0}
.tc-name{font-weight:800;font-size:1.02rem;color:var(--brand);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-verified{color:var(--brand-light);font-size:.9rem}
.tc-role{font-size:.85rem;color:var(--muted);margin-top:2px}
.tc-meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;
  color:var(--muted);margin-top:8px}
.tc-meta span{display:flex;align-items:center;gap:4px}
.tc-badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;
  background:#EFF4FA;color:var(--brand)}
.badge-green{background:#DCFCE7;color:#166534}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-gold{background:#FEF3C7;color:#92400E}
.tc-footer{display:flex;justify-content:space-between;align-items:center;
  margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.tc-price{font-weight:800;color:var(--brand);font-size:.95rem}
.tc-btn{background:var(--brand);color:#fff;padding:8px 16px;border-radius:10px;
  font-weight:700;font-size:.85rem;transition:background .2s}
.tc-btn:hover{background:var(--brand-light)}

/* ============ ESTRELLAS ============ */
.stars{display:inline-block;position:relative;font-size:.9rem;
  letter-spacing:1px;line-height:1}
.stars::before{content:"★★★★★";color:#E5E7EB}
.stars-fg{position:absolute;top:0;left:0;overflow:hidden;white-space:nowrap;
  color:var(--accent)}
.stars-fg::before{content:"★★★★★"}
.rating-num{font-weight:700;color:var(--text);font-size:.85rem;margin-left:4px}

/* ============ FILTROS ============ */
.filtros{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;display:flex;flex-wrap:wrap;
  gap:12px;align-items:center;margin-bottom:16px}
.filtro-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filtro-label{font-size:.75rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em}
.chip{padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:600;
  border:1px solid var(--border);background:#fff;color:var(--text);
  cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--brand)}
.chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;
  font-weight:600;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--brand);width:16px;height:16px}
select.sel{padding:8px 12px;border-radius:8px;border:1px solid var(--border);
  font-family:inherit;font-size:.85rem;background:#fff;color:var(--text)}

  border:4px solid rgba(255,255,255,.3)}
.perfil-info{flex:1;min-width:240px}
.perfil-info h1{font-size:1.6rem;font-weight:900;margin-bottom:4px}
.perfil-info .role{font-size:1rem;opacity:.92;margin-bottom:10px}
.perfil-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.stat{text-align:center}
.stat .num{font-size:1.35rem;font-weight:900;line-height:1}
.stat .label{font-size:.72rem;opacity:.85;margin-top:4px;

.btn-contacto{background:#fff;color:var(--brand);padding:14px 24px;
  border-radius:12px;font-weight:800;font-size:1rem;
  display:inline-flex;align-items:center;gap:8px;transition:transform .15s}

.perfil-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media (max-width:768px){.perfil-grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px}

.resena{padding:12px 0;border-bottom:1px solid var(--border)}

.resena-fecha{font-size:.75rem;color:var(--muted)}

.trabajo-item:last-child{border-bottom:none}

.trabajo-fecha{font-size:.75rem;color:var(--muted)}

  font-size:.8rem;font-weight:700;margin:4px 4px 4px 0}

/* ============ AUTH ============ */
.auth-wrap{max-width:440px;margin:40px auto}
.auth-card{background:var(--card);border:1px solid var(--border);

.auth-card p.sub{font-size:.9rem;color:var(--muted);margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.85rem;font-weight:700;
  color:var(--brand);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;
  border-radius:10px;border:1px solid var(--border);font-size:.95rem;
  font-family:inherit;background:#fff;color:var(--text);transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,59,102,.1)}
.btn-primary{width:100%;background:var(--brand);color:#fff;padding:14px;
  border-radius:12px;font-weight:800;font-size:1rem;transition:background .15s;margin-top:8px}
.btn-primary:hover{background:var(--brand-light)}
.btn-secondary{width:100%;background:transparent;color:var(--brand);
  padding:14px;border-radius:12px;font-weight:700;font-size:.95rem;
  border:1px solid var(--border);margin-top:8px;display:block;text-align:center}
.auth-switch{text-align:center;font-size:.9rem;color:var(--muted);margin-top:20px}
.auth-switch a{color:var(--brand);font-weight:700}
.demo-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center}

/* ============ PANEL ============ */
.panel-header{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;display:flex;gap:16px;
  align-items:center;flex-wrap:wrap;margin-bottom:20px}
.panel-header .avatar{width:64px;height:64px;border-radius:50%;
  background:var(--brand);color:#fff;display:grid;place-items:center;
  font-weight:900;font-size:1.4rem;flex-shrink:0}
.panel-header h1{font-size:1.3rem;color:var(--brand);font-weight:800}
.panel-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;margin-bottom:20px}
.panel-stat{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;text-align:center}
.panel-stat .num{font-size:1.6rem;font-weight:900;color:var(--brand)}
.panel-stat .label{font-size:.72rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* ============ VACÍO ============ */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .emoji{font-size:3rem;margin-bottom:12px}

/* ============ FOOTER ============ */
footer{background:var(--brand-dark);color:#fff;padding:32px 20px;
  margin-top:48px;text-align:center}
footer .foot-inner{max-width:1200px;margin:0 auto}
footer p{font-size:.85rem;opacity:.8;margin-top:8px}
footer .foot-logo{font-weight:900;font-size:1.1rem;
  display:inline-flex;align-items:center;gap:8px}
footer .foot-mark{width:28px;height:28px;background:#fff;color:var(--brand);
  border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:.9rem}

/* ============ RESPONSIVE ============ */
@media (max-width:600px){
  .logo span:last-child{display:none}
  .nav-links a:not(.nav-cta):not(.nav-user){display:none}
  .hero{padding:40px 16px 32px}
  .search-bar{flex-direction:column}
  .search-bar button{width:100%}
  .perfil-header{padding:20px}
  .perfil-avatar{width:72px;height:72px}
}

function getUsuarioActual(){
  try{ return JSON.parse(localStorage.getItem('tc_user')||'null'); }catch{ return null; }
}
function setUsuarioActual(u){
  localStorage.setItem('tc_user', JSON.stringify(u));

function cerrarSesion(){

  const pct = Math.max(0, Math.min(100, (r/5)*100));
  return `<span class="stars"><span class="stars-fg" style="width:${pct}%"></span></span>`;
}
function getOficio(id){ return OFICIOS.find(o=>o.id===id) || {nombre:id,emoji:'🛠️'}; }
function oficioNombre(id){ return getOficio(id).nombre; }
function buscarTrabajador(id){ return TRABAJADORES.find(t=>t.id===Number(id)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   VISTA: BUSCAR
   ============================================================ */
function viewBuscar(params){
  const oficioFiltro    = params.get('oficio') || 'todos';
  const soloDisponibles = params.get('disponibles') === '1';
  const soloVerificados = params.get('verificados') === '1';
  const orden           = params.get('orden') || 'cercania';

  let lista = TRABAJADORES.slice();
  if(oficioFiltro!=='todos') lista = lista.filter(t=>t.oficio===oficioFiltro);
  if(soloDisponibles) lista = lista.filter(t=>t.disponible);
  if(soloVerificados) lista = lista.filter(t=>t.verificado);
  if(orden==='cercania') lista.sort((a,b)=>a.distanciaKm-b.distanciaKm);
  if(orden==='rating')   lista.sort((a,b)=>b.rating-a.rating);
  if(orden==='trabajos') lista.sort((a,b)=>b.totalReviews-a.totalReviews);

  const qs = (extra={}) => {
    const p = new URLSearchParams();
    if(oficioFiltro!=='todos') p.set('oficio', oficioFiltro);
    if(soloDisponibles) p.set('disponibles','1');
    if(soloVerificados) p.set('verificados','1');
    if(orden!=='cercania') p.set('orden', orden);
    Object.entries(extra).forEach(([k,v])=> v==null||v===''||v===false ? p.delete(k) : p.set(k, v===true?'1':v));
    return p.toString();
  };

  return `
    <section class="section">
      <h1 class="section-title" style="margin-bottom:16px;">Buscar profesionales</h1>

      <div class="filtros">
        <div class="filtro-group">
          <span class="filtro-label">Oficio:</span>
          ${OFICIOS.map(o=>`
            <a class="chip ${o.id===oficioFiltro?'active':''}"
               href="#/buscar?${(()=>{const p=new URLSearchParams(); if(o.id!=='todos')p.set('oficio',o.id); if(soloDisponibles)p.set('disponibles','1'); if(soloVerificados)p.set('verificados','1'); if(orden!=='cercania')p.set('orden',orden); return p.toString();})()}">
              ${o.emoji} ${o.nombre}
            </a>`).join('')}
        </div>
      </div>

      <div class="filtros">
        <label class="toggle">
          <input type="checkbox" ${soloDisponibles?'checked':''}
                 onchange="actualizarFiltro('disponibles', this.checked)">
          Solo disponibles
        </label>
        <label class="toggle">
          <input type="checkbox" ${soloVerificados?'checked':''}
                 onchange="actualizarFiltro('verificados', this.checked)">
          Solo verificados
        </label>
        <div class="filtro-group" style="margin-left:auto;">
          <span class="filtro-label">Ordenar:</span>
          <select class="sel" onchange="actualizarFiltro('orden', this.value)">
            <option value="cercania" ${orden==='cercania'?'selected':''}>Más cercanos</option>
            <option value="rating"   ${orden==='rating'?'selected':''}>Mejor calificados</option>
            <option value="trabajos" ${orden==='trabajos'?'selected':''}>Más trabajos</option>
          </select>
        </div>
      </div>

      ${lista.length===0
        ? `<div class="empty"><div class="emoji">🔍</div><p>No encontramos profesionales con esos filtros.<br>Prueba ampliar la búsqueda.</p></div>`
        : `<div class="grid-trabajadores">${lista.map(cardTrabajador).join('')}</div>`}
    </section>`;
}

function actualizarFiltro(key, value){
  const { path, params } = parseHash();
  if(value===true || (typeof value==='string' && value && value!=='false')) {
    params.set(key, value===true ? '1' : value);
  } else {
    params.delete(key);
  }
  const s = params.toString();
  location.hash = path + (s?'?'+s:'');
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const [path, q] = hash.split('?');
  return { path, params: new URLSearchParams(q||'') };
}

function render(){
  const { path, params } = parseHash();
  const app = document.getElementById('app');
  let html = '';
  if(path==='/'||path==='')      html = viewHome();
  else if(path==='/buscar')       html = viewBuscar(params);
  else if(path.startsWith('/perfil/')) html = viewPerfil(path.split('/')[2]);
  else if(path==='/login')        html = viewLogin();
  else if(path==='/registro')     html = viewRegistro();
  else if(path==='/panel')        html = viewPanel();
  else html = `<div class="empty"><div class="emoji">😕</div><p>Página no encontrada.</p><p style="margin-top:12px;"><a href="#/" style="color:var(--brand);font-weight:700;">Volver al inicio</a></p></div>`;
  app.innerHTML = `<div class="view">${html}</div>`;
  renderNav();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', () => { renderNav(); render(); });
