<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrabajoConfiable — Oficios verificados. Gente que responde.</title>
  <meta name="description" content="Encuentra mecánicos, electricistas, plomeros y técnicos verificados y de confianza cerca de ti.">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0D3B66">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Open Graph (para compartir en WhatsApp / Instagram) -->
  <meta property="og:title" content="TrabajoConfiable">
  <meta property="og:description" content="Oficios verificados. Gente que responde.">
  <meta property="og:image" content="./icons/icon-512.png">
  <meta property="og:type" content="website">

  <style>
    :root {
      --brand: #0D3B66;
      --bg: #F7F9FB;
      --text: #1B1B1B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    h1 { color: var(--brand); font-size: 2rem; margin-bottom: 8px; }
    p  { font-size: 1rem; color: #555; max-width: 420px; }
    .badge {
      display: inline-block;
      background: var(--brand);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <h1>TrabajoConfiable</h1>
  <p>Oficios verificados. Gente que responde.</p>
  <span class="badge">Próximamente: registro, perfil y mapa</span>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(() => console.log('Service Worker registrado'))
        .catch(err => console.error('Error SW:', err));
    }
  </script>
</body>
</html>
