<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>El Punto Amarillo — Mecánicos, repuestos, grúas y más en un solo punto.</title>
<meta name="description" content="Encuentra mecánicos, repuestos, grúas, taxis, talleres y vehículos.">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1A1A1A">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta property="og:title" content="El Punto Amarillo">
<meta property="og:description" content="Mecánicos, repuestos, grúas, taxi y más en un solo punto.">
<meta property="og:image" content="./icons/icon-512.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
/* ============ BASE ============ */
:root{
  --brand:#1A1A1A; --brand-soft:#2B2B2B;
  --accent:#FFB800; --accent-dark:#E5A600;
  --success:#16A34A; --danger:#DC2626;
  --bg:#F5F5F7; --card:#FFF; --text:#1B1B1B; --muted:#6B7280;
  --border:#E5E7EB; --radius:14px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
  display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
img{max-width:100%;display:block}

/* ============ HEADER ============ */
header{background:var(--brand);color:#fff;padding:12px 20px;
  position:sticky;top:0;z-index:1000;box-shadow:var(--shadow-sm)}
.nav{max-width:1200px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:#fff}
.logo-mark{width:36px;height:36px;background:var(--accent);color:var(--brand);
  border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.9rem;
  box-shadow:0 0 0 3px rgba(255,184,0,.25)}
.nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav-links a,.nav-links button{color:#fff;font-size:.88rem;font-weight:600;
  padding:8px 14px;border-radius:10px;transition:background .2s}
.nav-links a:hover,.nav-links button:hover{background:rgba(255,255,255,.12)}
.nav-cta{background:var(--accent) !important;color:var(--brand) !important}
.nav-cta:hover{background:var(--accent-dark) !important}

/* ============ LAYOUT ============ */
main{flex:1;max-width:1200px;width:100%;margin:0 auto;padding:0 20px}
.view{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ HERO ============ */
.hero{padding:56px 20px 32px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,3rem);color:var(--brand);font-weight:900;
  letter-spacing:-.02em;line-height:1.15;margin-bottom:16px}
.hero h1 .dot{display:inline-block;width:.55em;height:.55em;background:var(--accent);
  border-radius:50%;vertical-align:middle;margin:0 .08em;transform:translateY(-.05em)}
.hero p{font-size:clamp(1rem,2.2vw,1.15rem);color:var(--muted);
  max-width:640px;margin:0 auto 28px}
.search-bar{max-width:640px;margin:0 auto;display:flex;gap:8px;background:#fff;
  padding:8px;border-radius:16px;box-shadow:var(--shadow-md)}
.search-bar input{flex:1;border:none;outline:none;padding:12px 16px;
  font-size:1rem;background:transparent;color:var(--text)}
.search-bar button{background:var(--accent);color:var(--brand);padding:12px 24px;
  border-radius:12px;font-weight:800;transition:background .2s}
.search-bar button:hover{background:var(--accent-dark)}
.hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);
  padding:10px 18px;border-radius:10px;font-weight:700;font-size:.9rem;
  display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
.btn-outline:hover{border-color:var(--brand)}

/* ============ SECCIONES ============ */
.section{padding:32px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;gap:12px;flex-wrap:wrap}
.section-title{font-size:1.4rem;font-weight:800;color:var(--brand)}
.section-link{color:var(--brand);font-weight:700;font-size:.9rem}

/* ============ CATEGORÍAS ============ */
.categorias{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.categoria{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 12px;text-align:center;
  cursor:pointer;transition:all .2s}
.categoria:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);
  border-color:var(--accent)}
.categoria .emoji{font-size:2.2rem;display:block;margin-bottom:8px}
.categoria .nombre{font-size:.9rem;font-weight:800;color:var(--brand)}

/* ============ TARJETA ============ */
.grid-trabajadores{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.trabajador-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;
  gap:12px;transition:all .2s}
.trabajador-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.tc-head{display:flex;gap:12px;align-items:flex-start}
.tc-avatar{width:56px;height:56px;border-radius:50%;object-fit:cover;
  background:var(--border);flex-shrink:0}
.tc-info{flex:1;min-width:0}
.tc-name{font-weight:800;font-size:1.02rem;color:var(--brand);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tc-verified{color:var(--success);font-size:.9rem}
.tc-role{font-size:.85rem;color:var(--muted);margin-top:2px}
.tc-meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;
  color:var(--muted);margin-top:8px}
.tc-meta span{display:flex;align-items:center;gap:4px}
.tc-badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;
  background:#F3F4F6;color:var(--brand)}
.badge-green{background:#DCFCE7;color:#166534}
.badge-red{background:#FEE2E2;color:#991B1B}
.badge-gold{background:#FEF3C7;color:#92400E}
.badge-yellow{background:var(--accent);color:var(--brand)}
.tc-footer{display:flex;justify-content:space-between;align-items:center;
  margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.tc-price{font-weight:800;color:var(--brand);font-size:.95rem}
.tc-btn{background:var(--accent);color:var(--brand);padding:8px 16px;border-radius:10px;
  font-weight:800;font-size:.85rem;transition:background .2s}
.tc-btn:hover{background:var(--accent-dark)}

/* ============ ESTRELLAS ============ */
.stars{display:inline-block;position:relative;font-size:.9rem;letter-spacing:1px;line-height:1}
.stars::before{content:"★★★★★";color:#E5E7EB}
.stars-fg{position:absolute;top:0;left:0;overflow:hidden;white-space:nowrap;color:var(--accent)}
.stars-fg::before{content:"★★★★★"}
.rating-num{font-weight:700;color:var(--text);font-size:.85rem;margin-left:4px}

/* ============ FILTROS ============ */
.filtros{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;display:flex;flex-wrap:wrap;
  gap:12px;align-items:center;margin-bottom:16px}
.filtro-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filtro-label{font-size:.75rem;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em}
.chip{padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:600;
  border:1px solid var(--border);background:#fff;color:var(--text);
  cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent);color:var(--brand);border-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;
  font-weight:600;cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
select.sel{padding:8px 12px;border-radius:8px;border:1px solid var(--border);
  font-family:inherit;font-size:.85rem;background:#fff;color:var(--text)}

/* ============ MAPA ============ */
.mapa-full{height:70vh;min-height:420px;border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-md);border:1px solid var(--border)}
.mapa-preview{height:340px;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-md);border:1px solid var(--border)}
.mapa-mini{height:260px;border-radius:12px;overflow:hidden;
  border:1px solid var(--border);margin-top:8px}
.marker-pin{display:grid;place-items:center;font-size:20px;
  width:40px;height:40px;border-radius:50% 50% 50% 0;
  transform:rotate(-45deg);border:3px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.3)}
.marker-pin > span{transform:rotate(45deg)}
.marker-mecanico{background:#FFB800}
.marker-repuestos{background:#2563EB}
.marker-gruas{background:#DC2626}
.marker-taxi{background:#0EA5E9}
.marker-mototaxi{background:#F97316}
.marker-talleres{background:#7C3AED}
.marker-vehiculos{background:#0891B2}

/* ============ PERFIL ============ */
.perfil-header{background:linear-gradient(135deg,var(--brand),var(--brand-soft));
  color:#fff;border-radius:var(--radius);padding:28px;display:flex;
  gap:20px;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}
.perfil-avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;
  border:4px solid var(--accent)}
.perfil-info{flex:1;min-width:240px}
.perfil-info h1{font-size:1.6rem;font-weight:900;margin-bottom:4px}
.perfil-info .role{font-size:1rem;opacity:.92;margin-bottom:10px}
.perfil-stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.stat{text-align:center}
.stat .num{font-size:1.35rem;font-weight:900;line-height:1;color:var(--accent)}
.stat .label{font-size:.72rem;opacity:.85;margin-top:4px;
  text-transform:uppercase;letter-spacing:.05em}
.btn-contacto{background:var(--accent);color:var(--brand);padding:14px 24px;
  border-radius:12px;font-weight:900;font-size:1rem;
  display:inline-flex;align-items:center;gap:8px;transition:transform .15s}
.btn-contacto:hover{transform:scale(1.02)}
.perfil-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
@media (max-width:768px){.perfil-grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h2{font-size:1.1rem;color:var(--brand);margin-bottom:12px;font-weight:800}
.resena{padding:12px 0;border-bottom:1px solid var(--border)}
.resena:last-child{border-bottom:none}
.resena-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.resena-autor{font-weight:700;font-size:.9rem}
.resena-fecha{font-size:.75rem;color:var(--muted)}
.resena-texto{font-size:.9rem;color:var(--text);margin-top:6px}
.trabajo-item{display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--border);gap:8px}
.trabajo-item:last-child{border-bottom:none}
.trabajo-titulo{font-size:.9rem;font-weight:600}
.trabajo-fecha{font-size:.75rem;color:var(--muted)}
.certificacion{display:inline-flex;align-items:center;gap:6px;
  background:#FEF3C7;color:#92400E;padding:6px 12px;border-radius:8px;
  font-size:.8rem;font-weight:700;margin:4px 4px 4px 0}

/* ============ GALERÍA ============ */
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;margin-top:4px}
.galeria img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;
  cursor:pointer;transition:transform .15s}
.galeria img:hover{transform:scale(1.03)}

/* ============ AUTH ============ */
.auth-wrap{max-width:500px;margin:40px auto}
.auth-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px;box-shadow:var(--shadow-md)}
.auth-card h1{font-size:1.6rem;color:var(--brand);margin-bottom:6px;font-weight:900}
.auth-card p.sub{font-size:.9rem;color:var(--muted);margin-bottom:20px}
.costo-banner{background:var(--accent);color:var(--brand);padding:14px 16px;
  border-radius:10px;margin-bottom:20px;text-align:center;font-weight:700}
.costo-banner small{display:block;font-weight:500;font-size:.78rem;opacity:.85;margin-top:4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.85rem;font-weight:700;
  color:var(--brand);margin-bottom:6px}
.field .hint{display:block;font-size:.75rem;color:var(--muted);
  font-weight:500;margin-top:4px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;
  border-radius:10px;border:1px solid var(--border);font-size:.95rem;
  font-family:inherit;background:#fff;color:var(--text);transition:border-color .15s}
.field input[type=file]{padding:8px}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,184,0,.2)}
.field-divider{border-top:1px dashed var(--border);margin:24px 0 20px;padding-top:8px;
  font-size:.75rem;font-weight:800;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em}
.btn-primary{width:100%;background:var(--accent);color:var(--brand);padding:14px;
  border-radius:12px;font-weight:800;font-size:1rem;transition:background .15s;margin-top:8px}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{width:100%;background:transparent;color:var(--brand);
  padding:14px;border-radius:12px;font-weight:700;font-size:.95rem;
  border:1px solid var(--border);margin-top:8px;display:block;text-align:center}
.auth-switch{text-align:center;font-size:.9rem;color:var(--muted);margin-top:20px}
.auth-switch a{color:var(--brand);font-weight:700;text-decoration:underline}
.demo-note{margin-top:16px;font-size:.75rem;color:var(--muted);text-align:center}

/* ============ PANEL ============ */
.panel-header{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px;display:flex;gap:16px;
  align-items:center;flex-wrap:wrap;margin-bottom:20px}
.panel-header .avatar{width:64px;height:64px;border-radius:50%;
  background:var(--accent);color:var(--brand);display:grid;place-items:center;
  font-weight:900;font-size:1.4rem;flex-shrink:0}
.panel-header h1{font-size:1.3rem;color:var(--brand);font-weight:800}
.panel-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;margin-bottom:20px}
.panel-stat{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:16px;text-align:center}
.panel-stat .num{font-size:1.6rem;font-weight:900;color:var(--brand)}
.panel-stat .label{font-size:.72rem;color:var(--muted);
  text-transform:uppercase;letter-spacing:.05em;margin-top:4px}

/* ============ CHAT ============ */
.chat-wrap{max-width:720px;margin:20px auto;display:flex;flex-direction:column;
  min-height:calc(100vh - 220px)}
.chat-lista{display:flex;flex-direction:column;gap:8px}
.chat-item{display:flex;gap:12px;align-items:center;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:14px;transition:all .15s}
.chat-item:hover{border-color:var(--accent);box-shadow:var(--shadow-sm)}
.chat-item img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex-shrink:0}
.chat-item-info{flex:1;min-width:0}
.chat-item-nombre{font-weight:800;color:var(--brand);font-size:.95rem}
.chat-item-ultimo{font-size:.82rem;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-conv{background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden;
  height:calc(100vh - 220px);min-height:420px}
.chat-conv-header{display:flex;align-items:center;gap:12px;
  padding:14px 18px;border-bottom:1px solid var(--border);background:#FAFAFA}
.chat-conv-header img{width:42px;height:42px;border-radius:50%;object-fit:cover}
.chat-conv-header .info{flex:1;min-width:0}
.chat-conv-header .nombre{font-weight:800;color:var(--brand);font-size:.98rem}
.chat-conv-header .rol{font-size:.78rem;color:var(--muted)}
.chat-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;background:#FAFAFA}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;font-size:.9rem;
  line-height:1.4;word-wrap:break-word;position:relative}
.msg-yo{align-self:flex-end;background:var(--accent);color:var(--brand);
  border-bottom-right-radius:4px}
.msg-ellos{align-self:flex-start;background:#fff;color:var(--text);
  border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-hora{font-size:.65rem;opacity:.6;margin-top:4px;display:block;text-align:right}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);background:#fff}
.chat-input input{flex:1;padding:12px 14px;border-radius:24px;
  border:1px solid var(--border);font-size:.95rem;font-family:inherit;outline:none}
.chat-input input:focus{border-color:var(--accent)}
.chat-input button{background:var(--accent);color:var(--brand);
  width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-size:1.2rem;transition:background .15s}
.chat-input button:hover{background:var(--accent-dark)}

/* ============ VACÍO ============ */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .emoji{font-size:3rem;margin-bottom:12px}

/* ============ FOOTER ============ */
footer{background:var(--brand);color:#fff;padding:32px 20px;
  margin-top:48px;text-align:center}
footer .foot-inner{max-width:1200px;margin:0 auto}
footer p{font-size:.85rem;opacity:.8;margin-top:8px}
footer .foot-logo{font-weight:900;font-size:1.1rem;
  display:inline-flex;align-items:center;gap:8px}
footer .foot-mark{width:28px;height:28px;background:var(--accent);color:var(--brand);
  border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.8rem}

/* ============ RESPONSIVE ============ */
@media (max-width:600px){
  .logo span:last-child{display:none}
  .nav-links a:not(.nav-cta):not(.nav-user){display:none}
  .hero{padding:36px 16px 24px}
  .search-bar{flex-direction:column}
  .search-bar button{width:100%}
  .perfil-header{padding:20px}
  .perfil-avatar{width:72px;height:72px}
  .mapa-full{height:60vh}
}
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a href="#/" class="logo">
      <span class="logo-mark">PA</span>
      <span>El Punto Amarillo</span>
    </a>
    <div class="nav-links" id="navLinks"></div>
  </nav>
</header>

<main id="app"></main>

<footer>
  <div class="foot-inner">
    <div class="foot-logo"><span class="foot-mark">PA</span> El Punto Amarillo</div>
    <p>Mecánicos, repuestos, grúas, taxi y más en un solo punto.</p>
    <p>© 2026 El Punto Amarillo · Mérida, Venezuela</p>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================================================
   CENTRO DEL MAPA 
   ============================================================ */
const CENTRO_MERIDA = { lat: 8.5895, lng: -71.1510 };
const ZOOM_MERIDA = 15;
const ZOOM_FULL = 14;

/* ============================================================
   CATEGORÍAS
   ============================================================ */
const TIPOS = [
  { id:'todos',     nombre:'Todos',     emoji:'📍' },
  { id:'mecanico',  nombre:'Mecánicos', emoji:'🔧' },
  { id:'repuestos', nombre:'Repuestos', emoji:'⚙️' },
  { id:'gruas',     nombre:'Grúas',     emoji:'🚛' },
  { id:'taxi',      nombre:'Taxi',      emoji:'🚕' },
  { id:'mototaxi',  nombre:'Moto Taxi', emoji:'🏍️' },
  { id:'talleres',  nombre:'Talleres',  emoji:'🏭' },
  { id:'vehiculos', nombre:'Vehículos', emoji:'🚗' }
];

/* ============================================================
   PERFILES — Todos ubicados en Mérida, Av. 16
   ============================================================ */
const PERFILES = [
  /* ---------- MECÁNICOS ---------- */
  {
    id:1, tipo:"mecanico", nombre:"Carlos Pérez",
    especialidad:"Mecánica general y frenos",
    foto:"https://i.pravatar.cc/200?img=12",
    rating:4.8, totalReviews:47, lat:8.5920, lng:-71.1490,
    direccion:"Av. 16 con Calle 26, Mérida",
    disponible:true, verificado:true,
    aniosExperiencia:15, precioHora:8,

/* ============================================================
   SESIÓN
   ============================================================ */
function getUsuarioActual(){
  try{ return JSON.parse(localStorage.getItem('epa_user')||'null'); }catch{ return null; }
}
function setUsuarioActual(u){
  localStorage.setItem('epa_user', JSON.stringify(u));
  renderNav();
}
function cerrarSesion(){
  localStorage.removeItem('epa_user');
  location.hash = '#/';
}

/* ============================================================
   HELPERS
   ============================================================ */
function estrellas(r){
  const pct = Math.max(0, Math.min(100, (r/5)*100));
  return `<span class="stars"><span class="stars-fg" style="width:${pct}%"></span></span>`;
}
function getTipo(id){ return TIPOS.find(t=>t.id===id) || {nombre:id,emoji:'📍'}; }
function tipoLabel(id){ return getTipo(id).nombre; }
function buscarPerfil(id){ return PERFILES.find(t=>t.id===Number(id)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
   NAV
   ============================================================ */
function renderNav(){
  const u = getUsuarioActual();
  const el = document.getElementById('navLinks');
  if(u){
    el.innerHTML = `
      <a href="#/mapa">Mapa</a>
      <a href="#/buscar">Buscar</a>
      <a href="#/chats" class="nav-user">Chats</a>
      <a href="#/panel">Mi panel</a>
      <button onclick="cerrarSesion()">Salir</button>`;
  } else {
    el.innerHTML = `
      <a href="#/mapa">Mapa</a>
      <a href="#/buscar">Buscar</a>
      <a href="#/login" class="nav-user">Ingresar</a>
      <a href="#/registro" class="nav-cta">Ofrecer servicios</a>`;
  }
}

/* ============================================================
   TARJETA
   ============================================================ */
function cardPerfil(t){
  const tipo = tipoLabel(t.tipo);
  const inicial = esc(t.nombre.charAt(0));
  const fallback = `this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%231A1A1A%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2260%22 font-size=%2245%22 text-anchor=%22middle%22 fill=%22%23FFB800%22 font-family=%22sans-serif%22 font-weight=%22900%22>${inicial}</text></svg>'`;

  const estado = t.tipo==='mecanico'
    ? (t.disponible
        ? '<span class="badge badge-green">● Disponible</span>'
        : '<span class="badge badge-red">● Ocupado</span>')
    : (t.abierto
        ? '<span class="badge badge-green">● Abierto</span>'
        : '<span class="badge badge-red">● Cerrado</span>');

  const verif = t.verificado ? '<span class="badge badge-gold">✔ Verificado</span>' : '';
  const tipoBadge = `<span class="badge badge-yellow">${getTipo(t.tipo).emoji} ${tipo}</span>`;

  return `
    <article class="trabajador-card">
      <div class="tc-head">
        <img class="tc-avatar" src="${t.foto}" alt="${esc(t.nombre)}" onerror="${fallback}">
        <div class="tc-info">
          <div class="tc-name">${esc(t.nombre)} ${t.verificado?'<span class="tc-verified" title="Verificado">✔</span>':''}</div>
          <div class="tc-role">${esc(t.especialidad)}</div>
          <div class="tc-meta">
            <span>${estrellas(t.rating)} <b class="rating-num">${t.rating}</b> <small>(${t.totalReviews})</small></span>
          </div>
        </div>
      </div>
      <div class="tc-badges">${tipoBadge}${estado}${verif}</div>
      <div class="tc-footer">
        <span class="tc-price">${t.tipo==='mecanico'?`$${t.precioHora}/hora`:esc(t.horario||'—')}</span>
        <a class="tc-btn" href="#/perfil/${t.id}">Ver perfil</a>
      </div>
    </article>`;
}

/* ============================================================
   MAPA
   ============================================================ */
let mapaInstancias = {};
function limpiarMapas(){
  Object.values(mapaInstancias).forEach(m=>{ try{ m.remove(); }catch(e){} });
  mapaInstancias = {};
}
function initMapa(containerId, perfiles, opts={}){
  if(!window.L) return;
  if(mapaInstancias[containerId]) return;
  const el = document.getElementById(containerId);
  if(!el) return;
  const zoom = opts.zoom || ZOOM_MERIDA;
  const map = L.map(containerId).setView([CENTRO_MERIDA.lat, CENTRO_MERIDA.lng], zoom);
  mapaInstancias[containerId] = map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);
  const markers = [];
  perfiles.forEach(p => {
    const clase = `marker-${p.tipo}`;
    const emoji = getTipo(p.tipo).emoji;
    const icon = L.divIcon({
      className: 'custom-marker',
      html: `<div class="marker-pin ${clase}"><span>${emoji}</span></div>`,
      iconSize: [40, 40], iconAnchor: [20, 40], popupAnchor: [0, -40]
    });
    const marker = L.marker([p.lat, p.lng], { icon }).addTo(map)
      .bindPopup(`<b>${esc(p.nombre)}</b><br><small>${esc(p.especialidad)}</small><br>⭐ ${p.rating} · ${p.totalReviews} reseñas<br><a href="#/perfil/${p.id}" style="color:#1A1A1A;font-weight:700;">Ver perfil →</a>`);
    markers.push(marker);
  });
  if(markers.length && opts.fitBounds !== false){
    const grupo = L.featureGroup(markers);
    map.fitBounds(grupo.getBounds(), { padding:[40,40], maxZoom:16 });
  }
  return map;
}

function buscarDesdeHome(){
  const q = (document.getElementById('searchInput').value||'').trim().toLowerCase();
  if(!q){ location.hash='#/buscar'; return; }
  const match = TIPOS.find(o=>o.id!=='todos' && (o.nombre.toLowerCase().includes(q)||o.id.includes(q)));
  location.hash = match ? `#/buscar?tipo=${match.id}&q=${encodeURIComponent(q)}` : `#/buscar?q=${encodeURIComponent(q)}`;
}

/* ============================================================
   VISTA: BUSCAR
   ============================================================ */
function viewBuscar(params){
  const tipoFiltro      = params.get('tipo') || 'todos';
  const soloVerificados = params.get('verificados') === '1';
  const soloDisponibles = params.get('disponibles') === '1';
  const orden           = params.get('orden') || 'rating';
  const q               = (params.get('q')||'').toLowerCase();

  let lista = PERFILES.slice();
  if(tipoFiltro!=='todos') lista = lista.filter(t=>t.tipo===tipoFiltro);
  if(soloVerificados) lista = lista.filter(t=>t.verificado);
  if(soloDisponibles) lista = lista.filter(t=>t.disponible || t.abierto);
  if(q) lista = lista.filter(t=>
    (t.nombre+' '+t.especialidad+' '+(t.descripcion||'')+' '+(t.productosDestacados||[]).join(' '))
      .toLowerCase().includes(q)
  );
  if(orden==='rating')   lista.sort((a,b)=>b.rating-a.rating);
  if(orden==='trabajos') lista.sort((a,b)=>b.totalReviews-a.totalReviews);
  if(orden==='nombre')   lista.sort((a,b)=>a.nombre.localeCompare(b.nombre));

  return `
    <section class="section">
      <h1 class="section-title" style="margin-bottom:16px;">Buscar</h1>

      <div class="filtros">
        <div class="filtro-group">
          <span class="filtro-label">Tipo:</span>
          ${TIPOS.map(o=>{
            const p = new URLSearchParams();
            if(o.id!=='todos') p.set('tipo', o.id);
            if(soloVerificados) p.set('verificados','1');
            if(soloDisponibles) p.set('disponibles','1');
            if(orden!=='rating') p.set('orden', orden);
            if(q) p.set('q', q);
            return `<a class="chip ${o.id===tipoFiltro?'active':''}" href="#/buscar?${p.toString()}">${o.emoji} ${o.nombre}</a>`;
          }).join('')}
        </div>
      </div>

      <div class="filtros">
        <label class="toggle">
          <input type="checkbox" ${soloVerificados?'checked':''}
                 onchange="actualizarFiltro('verificados', this.checked)">
          Solo verificados
        </label>
        <label class="toggle">
          <input type="checkbox" ${soloDisponibles?'checked':''}
                 onchange="actualizarFiltro('disponibles', this.checked)">
          Solo disponibles / abiertos
        </label>
        <div class="filtro-group" style="margin-left:auto;">
          <span class="filtro-label">Ordenar:</span>
          <select class="sel" onchange="actualizarFiltro('orden', this.value)">
            <option value="rating"   ${orden==='rating'?'selected':''}>Mejor calificados</option>
            <option value="trabajos" ${orden==='trabajos'?'selected':''}>Más reseñas</option>
            <option value="nombre"   ${orden==='nombre'?'selected':''}>Nombre A-Z</option>
          </select>
        </div>
      </div>

      ${lista.length===0
        ? `<div class="empty"><div class="emoji">🔍</div><p>No encontramos resultados.<br>Prueba otros filtros.</p></div>`
        : `<div class="grid-trabajadores">${lista.map(cardPerfil).join('')}</div>`}
    </section>`;
}

function actualizarFiltro(key, value){
  const { path, params } = parseHash();
  if(value===true || (typeof value==='string' && value && value!=='false')) {
    params.set(key, value===true ? '1' : value);
  } else {
    params.delete(key);
  }
  const s = params.toString();
  location.hash = path + (s?'?'+s:'');
}

/* ============================================================
   CHATS
   ============================================================ */
function getChats(){
  try{ return JSON.parse(localStorage.getItem('epa_chats')||'[]'); }catch{ return []; }
}
function saveChats(chats){ localStorage.setItem('epa_chats', JSON.stringify(chats)); }
function getChat(perfilId){ return getChats().find(c => c.perfilId === Number(perfilId)); }
function crearChatSiNoExiste(perfilId){
  const chats = getChats();
  if(chats.find(c => c.perfilId === Number(perfilId))) return;
  chats.unshift({ perfilId: Number(perfilId), mensajes: [] });
  saveChats(chats);
}
function enviarMensaje(perfilId, texto){
  const chats = getChats();
  let chat = chats.find(c => c.perfilId === Number(perfilId));
  if(!chat){ chat = { perfilId: Number(perfilId), mensajes: [] }; chats.unshift(chat); }
  chat.mensajes.push({ texto, emisor:'yo', hora: new Date().toISOString() });
  saveChats(chats);
  setTimeout(()=>{
    const chats2 = getChats();
    const c2 = chats2.find(c => c.perfilId === Number(perfilId));
    if(c2){
      const perfil = buscarPerfil(perfilId);
      c2.mensajes.push({
        texto: `Gracias por escribir a ${perfil?perfil.nombre:''}. En breve te respondo con más detalles.`,
        emisor:'ellos', hora: new Date().toISOString()
      });
      saveChats(chats2);
      if(location.hash === `#/chat/${perfilId}`) render();
    }
  }, 1500);
}

function viewChats(){
  const u = getUsuarioActual();
  if(!u){ location.hash='#/login'; return ''; }
  const chats = getChats();
  return `
    <section class="section">
      <h1 class="section-title" style="margin-bottom:16px;">Mis chats</h1>
      ${chats.length===0
        ? `<div class="empty"><div class="emoji">💬</div><p>No tienes conversaciones aún.<br>Explora el <a href="#/buscar" style="color:var(--brand);font-weight:700;text-decoration:underline;">directorio</a> y escribe a un profesional.</p></div>`
        : `<div class="chat-lista">${chats.map(c=>{
            const p = buscarPerfil(c.perfilId);
            if(!p) return '';
            const ultimo = c.mensajes[c.mensajes.length-1];
            return `
              <a class="chat-item" href="#/chat/${p.id}">
                <img src="${p.foto}" alt="${esc(p.nombre)}" onerror="this.style.display='none'">
                <div class="chat-item-info">
                  <div class="chat-item-nombre">${esc(p.nombre)}</div>
                  <div class="chat-item-ultimo">${ultimo?esc(ultimo.texto):'Sin mensajes aún'}</div>
                </div>
              </a>`;
          }).join('')}</div>`}
    </section>`;
}

function viewChat(perfilId){
  const u = getUsuarioActual();
  if(!u){ location.hash='#/login'; return ''; }
  const p = buscarPerfil(perfilId);
  if(!p) return `<div class="empty"><div class="emoji">😕</div><p>Perfil no encontrado.</p></div>`;
  crearChatSiNoExiste(perfilId);
  const chat = getChat(perfilId) || { mensajes: [] };
  const hora = iso => new Date(iso).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
  return `
    <section class="section">
      <a href="#/chats" style="color:var(--muted);font-size:.9rem;">← Volver a chats</a>
      <div class="chat-wrap">
        <div class="chat-conv">
          <div class="chat-conv-header">
            <img src="${p.foto}" alt="${esc(p.nombre)}" onerror="this.style.visibility='hidden'">
            <div class="info">
              <div class="nombre">${esc(p.nombre)}</div>
              <div class="rol">${esc(p.especialidad)}</div>
            </div>
            <a href="#/perfil/${p.id}" style="font-size:.85rem;color:var(--brand);font-weight:700;">Ver perfil</a>
          </div>
          <div class="chat-msgs" id="chat-msgs">
            ${chat.mensajes.length===0
              ? `<div class="empty" style="padding:20px;"><div class="emoji">👋</div><p style="font-size:.9rem;">Envía el primer mensaje para consultar disponibilidad, precios o coordinar un servicio.</p></div>`
              : chat.mensajes.map(m=>`
                  <div class="msg ${m.emisor==='yo'?'msg-yo':'msg-ellos'}">
                    ${esc(m.texto)}
                    <span class="msg-hora">${hora(m.hora)}</span>
                  </div>`).join('')}
          </div>
          <form class="chat-input" onsubmit="handleEnviarMensaje(event, ${p.id})">
            <input type="text" id="chatInput" placeholder="Escribe un mensaje…" autocomplete="off" required>
            <button type="submit" aria-label="Enviar">➤</button>
          </form>
        </div>
      </div>
    </section>`;
}

function handleEnviarMensaje(e, perfilId){
  e.preventDefault();
  const input = document.getElementById('chatInput');
  const texto = input.value.trim();
  if(!texto) return;
  enviarMensaje(perfilId, texto);
  input.value = '';
  render();
}

function handleLogin(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value;
  setUsuarioActual({
    nombre:'Mi cuenta', tipo:'mecanico',
    especialidad:'Cuenta demo', direccion:'Av. 16, Mérida',
    disponible:true, verificado:true, email
  });
  location.hash = '#/panel';
}

function handleRegistro(e){
  e.preventDefault();
  const tipo = document.getElementById('regTipo').value;
  const productosStr = (document.getElementById('regProductos')?.value || '');
  const tieneDniFoto = document.getElementById('regDniFoto')?.files?.length > 0;

  setUsuarioActual({
    nombre: document.getElementById('regNombre').value,
    tipo,
    especialidad: document.getElementById('regEspecialidad').value,
    direccion: document.getElementById('regDireccion').value,
    telefono: document.getElementById('regTelefono').value,
    dni: document.getElementById('regDni').value,
    dniFotoNombre: tieneDniFoto ? document.getElementById('regDniFoto').files[0].name : null,
    banco: document.getElementById('regBanco').value,
    ref1: document.getElementById('regRef1').value,
    ref2: document.getElementById('regRef2').value,
    aniosExperiencia: Number(document.getElementById('regExp')?.value)||0,
    precioHora: Number(document.getElementById('regPrecio')?.value)||0,
    horario: document.getElementById('regHorario')?.value || '',
    productosDestacados: productosStr ? productosStr.split(',').map(s=>s.trim()).filter(Boolean) : [],
    disponible:true, abierto:true, verificado:false,
    descripcion: document.getElementById('regDesc').value,
    plan:'basico-1usd'
  });
  location.hash = '#/panel';
}

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const hash = location.hash.replace(/^#/, '') || '/';
  const [path, q] = hash.split('?');
  return { path, params: new URLSearchParams(q||'') };
}

function render(){
  limpiarMapas();
  const { path, params } = parseHash();
  const app = document.getElementById('app');
  let html = '';

  if(path==='/'||path==='')             html = viewHome();
  else if(path==='/buscar')              html = viewBuscar(params);
  else if(path==='/mapa')                html = viewMapa();
  else if(path.startsWith('/perfil/'))   html = viewPerfil(path.split('/')[2]);
  else if(path==='/login')               html = viewLogin();
  else if(path==='/registro')            html = viewRegistro();
  else if(path==='/panel')               html = viewPanel();
  else if(path==='/chats')               html = viewChats();
  else if(path.startsWith('/chat/'))     html = viewChat(path.split('/')[2]);
  else html = `<div class="empty"><div class="emoji">😕</div><p>Página no encontrada.</p><p style="margin-top:12px;"><a href="#/" style="color:var(--brand);font-weight:700;text-decoration:underline;">Volver al inicio</a></p></div>`;

  app.innerHTML = `<div class="view">${html}</div>`;
  renderNav();
  window.scrollTo(0,0);

  setTimeout(()=>{
    if(path==='/' || path===''){
      initMapa('mapa-home', PERFILES, { zoom: ZOOM_FULL });
    }
    if(path==='/mapa'){
      const tipo = new URLSearchParams(location.hash.split('?')[1]||'').get('tipo') || 'todos';
      const lista = tipo==='todos' ? PERFILES : PERFILES.filter(t=>t.tipo===tipo);
      initMapa('mapa-full', lista, { zoom: ZOOM_FULL });
    }
    if(path.startsWith('/perfil/')){
      const id = path.split('/')[2];
      const t = buscarPerfil(id);
      if(t){
        const map = initMapa(`mapa-mini-${t.id}`, [t], { zoom: 16, fitBounds: false });
        if(map) map.setView([t.lat, t.lng], 16);
      }
    }
    if(path==='/registro'){ toggleCamposRegistro(); }
    if(path.startsWith('/chat/')){
      const msgs = document.getElementById('chat-msgs');
      if(msgs) msgs.scrollTop = msgs.scrollHeight;
    }
  }, 60);
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', ()=>{ renderNav(); render(); });

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js',{scope:'./'})
    .then(()=>console.log('Service Worker registrado'))
    .catch(err=>console.error('Error SW:',err));
}
</script>
</body>
</html>
